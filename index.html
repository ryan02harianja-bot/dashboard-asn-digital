<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Manajemen ASN Digital </title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (xlsx) for Excel Upload Support -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            background-color: #0b1120;
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
        }
        .card-dark {
            background-color: #111827;
            border: 1px solid #1f2937;
        }
    </style>
</head>
<body class="p-6">

    <!-- Header & Action Bar -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-bold text-white">Detail Data ASN Digital</h1>
            <p class="text-sm text-gray-400">Tabel rincian data pegawai & status literasi digital</p>
        </div>
        <div class="flex items-center gap-3">
            <span id="dataStatusBadge" class="px-3 py-1 text-xs rounded-full bg-blue-900 text-blue-200 border border-blue-700">
                Memuat Data Asli...
            </span>
            <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-4 py-2 rounded-lg transition font-medium">
                Upload Excel Baru
                <input type="file" id="excelFileInput" accept=".xlsx, .xls" class="hidden" onchange="handleFileUpload(event)">
            </label>
        </div>
    </div>

    <!-- Filter & Search Controls -->
    <div class="card-dark p-4 rounded-xl mb-6 flex flex-wrap gap-4 justify-between items-center">
        <div class="relative flex-1 min-w-[280px]">
            <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Cari Nama, NIP, Jabatan..." 
                   class="w-full bg-gray-900 border border-gray-700 rounded-lg pl-10 pr-4 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500">
            <svg class="w-4 h-4 text-gray-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
        </div>
        <div>
            <select id="filterLiterasi" onchange="handleFilter()" class="bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                <option value="ALL">Semua Literasi</option>
                <option value="Optimal">Optimal</option>
                <option value="Belum Optimal">Belum Optimal</option>
            </select>
        </div>
    </div>

    <!-- Data Table -->
    <div class="card-dark rounded-xl overflow-hidden shadow-xl mb-6">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-gray-800 text-xs font-semibold text-gray-400 uppercase tracking-wider bg-gray-900/50">
                        <th class="py-3 px-4">Nama & NIP</th>
                        <th class="py-3 px-4">Jabatan</th>
                        <th class="py-3 px-4">Kategori ASN</th>
                        <th class="py-3 px-4">Unit Kerja (UNOR)</th>
                        <th class="py-3 px-4 text-center">Literasi Digital</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-gray-800 text-sm">
                    <!-- Rows will be dynamically rendered here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination Controls -->
    <div class="flex justify-between items-center text-sm text-gray-400">
        <div id="paginationInfo">Menampilkan 0 dari 0 data</div>
        <div class="flex items-center gap-2">
            <button id="btnPrev" onclick="changePage(-1)" class="px-3 py-1 bg-gray-800 hover:bg-gray-700 text-white rounded disabled:opacity-50 disabled:cursor-not-allowed">Previous</button>
            <span id="pageIndicator" class="text-white px-2">Page 1 of 1</span>
            <button id="btnNext" onclick="changePage(1)" class="px-3 py-1 bg-gray-800 hover:bg-gray-700 text-white rounded disabled:opacity-50 disabled:cursor-not-allowed">Next</button>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        let rawData = [];
        let filteredData = [];
        let currentPage = 1;
        const rowsPerPage = 8;

        // Auto load real data on page load
        document.addEventListener("DOMContentLoaded", () => {
            loadRealData();
        });

        // Function to fetch data.json containing full real dataset
        async function loadRealData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) {
                    throw new Error("File data.json tidak ditemukan");
                }
                rawData = await response.json();
                
                document.getElementById('dataStatusBadge').innerText = `Data Asli Terload (${rawData.length.toLocaleString()} Data)`;
                document.getElementById('dataStatusBadge').className = "px-3 py-1 text-xs rounded-full bg-green-900 text-green-200 border border-green-700";
                
                applyFiltersAndRender();
            } catch (error) {
                console.warn("Gagal memuat data.json:", error);
                document.getElementById('dataStatusBadge').innerText = "Silakan Upload File Excel Data Asli";
                document.getElementById('dataStatusBadge').className = "px-3 py-1 text-xs rounded-full bg-yellow-900 text-yellow-200 border border-yellow-700";
                
                document.getElementById('tableBody').innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-8 text-gray-500">
                            Belum ada data. Silakan letakkan file <code>data.json</code> di root folder atau unggah file Excel melalui tombol di atas.
                        </td>
                    </tr>
                `;
            }
        }

        // Apply Search and Filters
        function applyFiltersAndRender() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            const filterLiterasi = document.getElementById('filterLiterasi').value;

            filteredData = rawData.filter(item => {
                const matchesSearch = 
                    (item["NAMA"] && item["NAMA"].toLowerCase().includes(searchQuery)) ||
                    (item["NIP"] && item["NIP"].toLowerCase().includes(searchQuery)) ||
                    (item["JABATAN"] && item["JABATAN"].toLowerCase().includes(searchQuery)) ||
                    (item["UNOR"] && item["UNOR"].toLowerCase().includes(searchQuery));

                const matchesLiterasi = 
                    filterLiterasi === "ALL" || 
                    (item["LITERASI DIGITAL"] && item["LITERASI DIGITAL"].toLowerCase() === filterLiterasi.toLowerCase());

                return matchesSearch && matchesLiterasi;
            });

            currentPage = 1;
            renderTable();
        }

        // Render Table Content and Pagination
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-gray-500">Data tidak ditemukan</td></tr>`;
                document.getElementById('paginationInfo').innerText = "Menampilkan 0 data";
                document.getElementById('pageIndicator').innerText = "Page 0 of 0";
                document.getElementById('btnPrev').disabled = true;
                document.getElementById('btnNext').disabled = true;
                return;
            }

            const totalPages = Math.ceil(filteredData.length / rowsPerPage);
            const startIndex = (currentPage - 1) * rowsPerPage;
            const endIndex = Math.min(startIndex + rowsPerPage, filteredData.length);
            const pageItems = filteredData.slice(startIndex, endIndex);

            pageItems.forEach(item => {
                const isOptimal = (item["LITERASI DIGITAL"] || "").toLowerCase() === "optimal";
                const badgeClass = isOptimal 
                    ? "bg-emerald-950 text-emerald-400 border-emerald-800" 
                    : "bg-rose-950 text-rose-400 border-rose-800";

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-800/40 transition";
                tr.innerHTML = `
                    <td class="py-3 px-4">
                        <div class="font-bold text-white">${item["NAMA"] || '-'}</div>
                        <div class="text-xs text-gray-400">NIP: ${item["NIP"] || '-'}</div>
                    </td>
                    <td class="py-3 px-4">
                        <div class="text-gray-200">${item["JABATAN"] || '-'}</div>
                        <div class="text-xs text-gray-500">${item["JENIS JABATAN"] || 'Jabatan'}</div>
                    </td>
                    <td class="py-3 px-4">
                        <span class="px-2 py-0.5 text-xs rounded bg-blue-950 text-blue-400 border border-blue-800">
                            ${item["KATEGORI"] || 'ASN'}
                        </span>
                    </td>
                    <td class="py-3 px-4 text-gray-300 text-xs max-w-xs truncate" title="${item["UNOR"] || ''}">
                        ${item["UNOR"] || '-'}
                    </td>
                    <td class="py-3 px-4 text-center">
                        <span class="px-3 py-1 text-xs rounded-full border ${badgeClass}">
                            ${item["LITERASI DIGITAL"] || 'Belum Optimal'}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Update Pagination UI
            document.getElementById('paginationInfo').innerText = 
                `Menampilkan ${startIndex + 1} - ${endIndex} dari ${filteredData.length.toLocaleString()} data`;
            document.getElementById('pageIndicator').innerText = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('btnPrev').disabled = currentPage === 1;
            document.getElementById('btnNext').disabled = currentPage === totalPages;
        }

        function changePage(direction) {
            currentPage += direction;
            renderTable();
        }

        function handleSearch() {
            applyFiltersAndRender();
        }

        function handleFilter() {
            applyFiltersAndRender();
        }

        // Handle Manual Upload from Excel
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                rawData = XLSX.utils.sheet_to_json(worksheet);
                
                document.getElementById('dataStatusBadge').innerText = `Data Excel Terload (${rawData.length.toLocaleString()} Data)`;
                document.getElementById('dataStatusBadge').className = "px-3 py-1 text-xs rounded-full bg-green-900 text-green-200 border border-green-700";
                
                applyFiltersAndRender();
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
